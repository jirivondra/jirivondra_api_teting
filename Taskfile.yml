version: '3'

tasks:
  # --- Tests ---
  run-test:
    desc: Run all tests
    cmd: npm run test

  test-watch:
    desc: Run tests in watch mode
    cmd: npm run test-watch

  test-result:
    desc: Run tests with verbose output
    cmd: npm run test-verbose

  test-coverage:
    desc: Run tests with code coverage report
    cmd: npm run test-coverage

  # --- Allure report ---
  report:
    desc: Run tests and generate an Allure report
    cmds:
      - npm run test-report
      - npm run allure-generate
      - npm run allure-open

  # --- Code quality ---
  lint:
    desc: Check code with ESLint
    cmd: npm run lint

  lint-fix:
    desc: Auto-fix lint issues with ESLint
    cmd: npm run lint-fix

  format-check:
    desc: Check code formatting with Prettier
    cmd: npm run format-check

  check:
    desc: Run all code quality checks (ESLint + Prettier)
    cmds:
      - task: lint
      - task: format-check

  fix:
    desc: Auto-fix formatting and lint issues (Prettier + ESLint)
    cmds:
      - npm run format
      - npm run lint-fix
